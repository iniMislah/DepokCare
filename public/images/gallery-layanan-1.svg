<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAF4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#grad1)" />
  <rect x="15" y="15" width="570" height="370" rx="20" fill="none" stroke="#DCEBFA" stroke-width="2" />
  
  <!-- Decorative Grid Pattern -->
  <g opacity="0.06" stroke="#0EA5E9" stroke-width="1.5">
    <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" />
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 550,0 L 550,400" />
  </g>
  
  <!-- Stylized Paramedics & Patient Graphic -->
  <g transform="translate(180, 80)">
    <!-- Glow -->
    <rect x="-10" y="-10" width="260" height="170" rx="25" fill="#0EA5E9" opacity="0.04" filter="blur(10px)" />
    
    <!-- Heart pulse background shape -->
    <path d="M 10,75 C 60,75 80,10 100,140 C 110,140 120,75 230,75" fill="none" stroke="#DCEBFA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Paramedic Icon Left -->
    <g transform="translate(40, 40)">
      <circle cx="20" cy="20" r="15" fill="#0EA5E9" />
      <!-- Cross in badge -->
      <path d="M 17,20 L 23,20 M 20,17 L 20,23" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 5,45 C 5,35 12,38 20,38 C 28,38 35,35 35,45 Z" fill="#0EA5E9" />
    </g>
    
    <!-- Patient Bed Icon Center -->
    <g transform="translate(95, 55)">
      <rect x="0" y="25" width="50" height="6" rx="2" fill="#475569" />
      <circle cx="25" cy="18" r="8" fill="#94A3B8" />
      <path d="M 12,31 C 12,28 38,28 38,31 Z" fill="#94A3B8" />
    </g>
    
    <!-- Paramedic Icon Right -->
    <g transform="translate(160, 40)">
      <circle cx="20" cy="20" r="15" fill="#0EA5E9" />
      <path d="M 17,20 L 23,20 M 20,17 L 20,23" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 5,45 C 5,35 12,38 20,38 C 28,38 35,35 35,45 Z" fill="#0EA5E9" />
    </g>
  </g>
  
  <!-- Text Overlay -->
  <text x="300" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">Dokumentasi Layanan Medis</text>
  <text x="300" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">DAMPINGAN MEDIS 24 JAM DI JALAN</text>
  
  <!-- Badge -->
  <rect x="235" y="35" width="130" height="26" rx="13" fill="url(#accentGrad)" />
  <text x="300" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">DOKUMENTASI</text>
</svg>
