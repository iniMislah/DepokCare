<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAF4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#grad1)" />
  <rect x="15" y="15" width="570" height="370" rx="20" fill="none" stroke="#DCEBFA" stroke-width="2" />
  
  <!-- Decorative Grid Pattern -->
  <g opacity="0.06" stroke="#0EA5E9" stroke-width="1.5">
    <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" />
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 550,0 L 550,400" />
  </g>
  
  <!-- Stylized Monitor Vital / Medical Device -->
  <g transform="translate(180, 80)">
    <!-- Monitor Body -->
    <rect x="20" y="20" width="200" height="120" rx="10" fill="#1E293B" stroke="#475569" stroke-width="4" />
    <!-- Screen -->
    <rect x="30" y="30" width="140" height="100" rx="4" fill="#0F172A" />
    <!-- Heart rate wave line -->
    <path d="M 35,80 L 60,80 L 70,50 L 80,110 L 90,80 L 120,80 L 130,60 L 140,100 L 150,80 L 165,80" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulsing glow at the end of the wave -->
    <circle cx="165" cy="80" r="4" fill="#22C55E" />
    
    <!-- Numeric indicator on the right of screen -->
    <text x="195" y="55" font-family="monospace" font-size="20" font-weight="bold" fill="#22C55E" text-anchor="middle">98</text>
    <text x="195" y="68" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">HR (BPM)</text>
    
    <text x="195" y="95" font-family="monospace" font-size="18" font-weight="bold" fill="#0EA5E9" text-anchor="middle">99%</text>
    <text x="195" y="108" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">SpO2</text>
    
    <!-- Knobs and buttons -->
    <circle cx="185" cy="125" r="4" fill="#64748B" />
    <circle cx="205" cy="125" r="4" fill="#64748B" />
  </g>
  
  <!-- Text Overlay -->
  <text x="300" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">Alat Monitoring Pasien</text>
  <text x="300" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">MONITOR VITAL SIGN &amp; DEFIBRILLATOR READY</text>
  
  <!-- Badge -->
  <rect x="235" y="35" width="130" height="26" rx="13" fill="url(#accentGrad)" />
  <text x="300" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PERALATAN MEDIS</text>
</svg>
